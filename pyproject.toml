[project]
name = "pantheon"
version = "0.0.1"
description = "A terminal command deck: task queue + agent supervisor + usage HUD in tmux"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not walk'"
markers = [
    "walk: scripted tmux walk; runs only on request (pytest -m walk), inside the tmux",
]
